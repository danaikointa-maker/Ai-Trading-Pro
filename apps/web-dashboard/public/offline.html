<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090c" />
    <title>ออฟไลน์ · No7 AI Trading Pro</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07090c; color: #e8ecf3;
        font-family: ui-sans-serif, system-ui, "Noto Sans Thai", sans-serif; }
      main { max-width: 30rem; margin: 0 auto; padding: 12vh 1.5rem; line-height: 1.7; }
      h1 { font-size: 1.05rem; margin: 0 0 .5rem; color: #f5b541; }
      p { font-size: .875rem; color: #9aa6b8; margin: .4rem 0; }
      button { margin-top: 1.25rem; padding: .6rem 1.1rem; border-radius: .5rem; cursor: pointer;
        border: 1px solid #2a3546; background: #111722; color: #e8ecf3; font-size: .875rem; }
      button:hover { border-color: #f5b541; color: #f5b541; }
      code { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <main>
      <h1>ตอนนี้ต่อเซิร์ฟเวอร์ไม่ได้</h1>
      <p>หน้าเว็บถูกแคชไว้ให้เปิดได้ แต่ข้อมูลราคา/คำสั่งเทรดต้องต่อกับเซิร์ฟเวอร์เสมอ — ระบบจะไม่แสดงราคาเก่าเหมือนเป็นราคาปัจจุบัน</p>
      <p>ตรวจว่าเทอร์มินัล/เซิร์ฟเวอร์ยังรันอยู่ (<code>scripts/run.sh</code>) แล้วกดลองใหม่</p>
      <button onclick="location.replace('/')">ลองอีกครั้ง</button>
    </main>
  </body>
</html>
