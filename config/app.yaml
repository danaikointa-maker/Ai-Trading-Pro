# No7 AI Trading Pro V1 — application configuration
app:
  name: No7 AI Trading Pro
  version: V1
  timezone: Asia/Bangkok
  base_currency: USD
  decision_interval_seconds: 4        # strategy cycle
  snapshot_interval_seconds: 1        # websocket push
  max_decision_history: 500

paths:
  # Every path is resolved against NO7_ROOT (env). No absolute paths in code.
  database: ${NO7_DB_PATH:storage/db/no7.sqlite3}
  datasets: ${NO7_DATA_DIR:storage/datasets}
  models: ${NO7_MODEL_DIR:storage/models}
  backtests: ${NO7_BACKTEST_DIR:storage/backtests}
  logs: ${NO7_LOG_DIR:storage/logs}

market_data:
  feed_mode: ${NO7_FEED_MODE:simulate}     # simulate | mt5 | replay (imported candles)
  default_symbol: XAUUSD
  default_broker: connext-demo
  timeframes: [M1, M5, M15, H1, H4]
  history_bars: ${NO7_SIM_BARS:60000}
  staleness_seconds: 30                    # reject decisions on older data
  simulation:
    seed: ${NO7_SIM_SEED:7}
    speed_minutes_per_second: ${NO7_SIM_SPEED:6.0}
    start_price: 4180.00
    annual_volatility: 0.16
    tick_seconds: 0.5
    news_shock_probability: 0.0015          # per bar
    regime_duration_bars: [180, 900]
  # feed_mode: replay -> walk real candles imported with scripts/import_candles.py.
  # When the file runs out the clock stops and the feed reports `exhausted`; it never
  # invents bars past the end of the data.
  replay:
    dataset_dir: storage/datasets
    timeframe: M1
    warmup_bars: 6000                       # bars visible to analysis before replay starts
    speed_minutes_per_second: 6.0           # market minutes per real second
    tick_seconds: 0.5
    loop: false                             # true replays from the start again (never mixes with the old tail)

ai:
  enabled: true
  horizons_minutes: [5, 15, 30, 60, 240]
  training:
    auto_train_on_boot: true
    max_rows: 26000
    train_fraction: 0.70
    calibration_fraction: 0.15
    min_directional_accuracy: 0.52
    min_brier_improvement: 0.02
    validation_folds: 4                    # chronological blocks inside the OOS set
    min_fold_pass_rate: 0.75
    min_validation_folds: 3                # a majority of one fold is one fold — no approval               # must pass the same gates in most blocks
    walk_forward_folds: 3                  # refit per fold (0 = score slices of one model)
    walk_forward_min_train_rows: 900       # skip folds with less history than this
    quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  forecast:
    deadband_atr: 0.25                      # |ret| < x*ATR => sideways class
    fan_points: 24

security:
  jwt_ttl_minutes: ${NO7_JWT_TTL_MINUTES:720}
  jwt_secret_env: NO7_JWT_SECRET
  demo_user: ${NO7_DEMO_USER:demo@no7.ai}
  demo_password: ${NO7_DEMO_PASSWORD:no7demo1234}
  require_auth: true
  allow_full_auto: ${NO7_ALLOW_FULL_AUTO:false}

execution:
  order_timeout_seconds: 20
  # Orders are sent once. An unconfirmed result is verified against the broker
  # and surfaced to the operator — never resent automatically.
  max_retries: 0
  slippage_points_default: 2
  reconcile_interval_seconds: 10
  idempotency_ttl_minutes: 120
  verify_after_send: true

alerts:
  channels: [inapp]
  telegram_enabled: false
  line_enabled: false
  min_score: 70

# WebSocket: a light frame every second, a full payload (with analysis/forecast)
# at least this often so those panels never freeze.
ws:
  full_snapshot_seconds: 5

# Per-identity limits (token buckets). Separate from the login throttle: this is
# about capacity, not credentials. `default` covers GETs and everything unlisted.
ratelimit:
  enabled: true
  # memory = buckets live in this process (default, one uvicorn worker).
  # sqlite = buckets live in a small SQLite file, so several workers on this host
  #          share one budget. Costs a write per limited request; the file defaults
  #          to storage/db/ratelimit.sqlite3 (override with store_path).
  store: memory
  rules:
    order: {limit: 10, window_seconds: 60}
    explain: {limit: 20, window_seconds: 60}
    backtest: {limit: 6, window_seconds: 60}
    train: {limit: 2, window_seconds: 3600}
    default: {limit: 300, window_seconds: 60}
