# No7 AI Trading Pro V1 — application configuration
app:
  name: No7 AI Trading Pro
  version: V1
  timezone: Asia/Bangkok
  base_currency: USD
  decision_interval_seconds: 4        # strategy cycle
  snapshot_interval_seconds: 1        # websocket push
  max_decision_history: 500

paths:
  # Every path is resolved against NO7_ROOT (env). No absolute paths in code.
  database: ${NO7_DB_PATH:storage/db/no7.sqlite3}
  datasets: ${NO7_DATA_DIR:storage/datasets}
  models: ${NO7_MODEL_DIR:storage/models}
  backtests: ${NO7_BACKTEST_DIR:storage/backtests}
  logs: ${NO7_LOG_DIR:storage/logs}

market_data:
  feed_mode: ${NO7_FEED_MODE:simulate}     # simulate | mt5 | replay (imported candles)
  default_symbol: XAUUSD
  default_broker: connext-demo
  timeframes: [M1, M5, M15, H1, H4]
  history_bars: ${NO7_SIM_BARS:60000}
  staleness_seconds: 30                    # reject decisions on older data
  simulation:
    seed: ${NO7_SIM_SEED:7}
    speed_minutes_per_second: ${NO7_SIM_SPEED:6.0}
    start_price: 4180.00
    annual_volatility: 0.16
    tick_seconds: 0.5
    news_shock_probability: 0.0015          # per bar
    regime_duration_bars: [180, 900]
  # feed_mode: replay -> walk real candles imported with scripts/import_candles.py.
  # When the file runs out the clock stops and the feed reports `exhausted`; it never
  # invents bars past the end of the data.
  replay:
    dataset_dir: storage/datasets
    timeframe: M1
    warmup_bars: 6000                       # bars visible to analysis before replay starts
    speed_minutes_per_second: 6.0           # market minutes per real second
    tick_seconds: 0.5
    loop: false                             # true replays from the start again (never mixes with the old tail)

ai:
  enabled: true
  horizons_minutes: [5, 15, 30, 60, 240]
  training:
    auto_train_on_boot: true
    max_rows: 26000
    train_fraction: 0.70
    calibration_fraction: 0.15
    min_directional_accuracy: 0.52
    min_brier_improvement: 0.02
    validation_folds: 4                    # chronological blocks inside the OOS set
    min_fold_pass_rate: 0.75
    min_validation_folds: 3                # a majority of one fold is one fold — no approval               # must pass the same gates in most blocks
    walk_forward_folds: 3                  # refit per fold (0 = score slices of one model)
    walk_forward_min_train_rows: 900       # skip folds with less history than this
    quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  forecast:
    deadband_atr: 0.25                      # |ret| < x*ATR => sideways class
    fan_points: 24

# Perimeter. The dashboard is served from this same origin and the Vite dev server
# proxies /api, so no cross-origin caller is allowed by default (an empty list).
# Put a reverse proxy in front for HTTPS; list it in trusted_proxies so that the
# client IP and the original scheme come from the proxy instead of being guessed.
cors:
  allow_origins: ${NO7_CORS_ORIGINS:}          # comma separated; "*" is allowed but reported

trusted_proxies: ${NO7_TRUSTED_PROXIES:127.0.0.1/32,::1/128}   # whose X-Forwarded-* we believe

security_headers:
  csp_mode: ${NO7_CSP_MODE:enforce}            # enforce | report (Report-Only) | off
  hsts: ${NO7_HSTS:true}                       # only ever sent over HTTPS

security:
  jwt_ttl_minutes: ${NO7_JWT_TTL_MINUTES:720}
  jwt_secret_env: NO7_JWT_SECRET
  demo_user: ${NO7_DEMO_USER:demo@no7.ai}
  demo_password: ${NO7_DEMO_PASSWORD:no7demo1234}
  # Roles: admin > trader > viewer. The demo account is admin so a fresh install is
  # usable; create a viewer/trader account before handing this to anyone else.
  # Existing "owner" roles are mapped to admin on boot.
  demo_role: ${NO7_DEMO_ROLE:admin}
  require_auth: true
  allow_full_auto: ${NO7_ALLOW_FULL_AUTO:false}

execution:
  order_timeout_seconds: 20
  # Orders are sent once. An unconfirmed result is verified against the broker
  # and surfaced to the operator — never resent automatically.
  max_retries: 0
  slippage_points_default: 2
  reconcile_interval_seconds: 10
  idempotency_ttl_minutes: 120
  verify_after_send: true

# ---------------------------------------------------------------------------
# EA bridge: an MQL5 Expert Advisor inside a Windows MT5 terminal polls this
# server, executes, and reports back. The token per account is the whole
# credential — leave it empty to disable the account (fail closed).
#
# Nothing old is reused: quotes/positions are only served while their snapshot
# is inside `fresh_seconds`/`stale_seconds`, a command is delivered once, and a
# reconnect discards the previous session's queue and snapshot.
# ---------------------------------------------------------------------------
bridge:
  enabled: ${NO7_BRIDGE_ENABLED:false}
  fresh_seconds: ${NO7_BRIDGE_FRESH_SECONDS:5}
  stale_seconds: ${NO7_BRIDGE_STALE_SECONDS:15}
  command_ttl_seconds: ${NO7_BRIDGE_COMMAND_TTL:30}
  ack_grace_seconds: ${NO7_BRIDGE_ACK_GRACE:20}
  max_pending: ${NO7_BRIDGE_MAX_PENDING:50}
  poll_interval_ms: ${NO7_BRIDGE_POLL_MS:1000}
  order_timeout_seconds: ${NO7_BRIDGE_ORDER_TIMEOUT:20}
  accounts:
    - id: mt5-bridge-demo
      label: MT5 (EA bridge, demo)
      token: ${NO7_BRIDGE_TOKEN:}

alerts:
  # In-app alerts are always on. External channels are opt-in: an outbound
  # message leaves this machine, so it needs a token *and* an explicit enable.
  # Tokens are read from env only and never written to config or API responses.
  channels: [inapp]                        # add telegram / line / webhook to enable
  min_score: 70
  dedupe_seconds: 60                       # identical title+symbol inside this window is skipped
  timeout_seconds: 5
  # Retries cover the transient end of the network (timeout, 429, 5xx) and honour
  # Retry-After. A 4xx that means "bad token / bad chat id" is never retried.
  retry_attempts: 3
  retry_backoff_seconds: 0.5
  # Minimum gap between two messages on the same channel. A burst gets the bot
  # rate-limited or muted by Telegram; skipped messages are counted as `dropped`.
  min_interval_seconds: 1.0
  telegram_enabled: ${NO7_TELEGRAM_ENABLED:false}   # needs TELEGRAM_BOT_TOKEN + chat id
  telegram_chat_id: ${NO7_TELEGRAM_CHAT_ID:}
  line_enabled: ${NO7_LINE_ENABLED:false}          # needs LINE_CHANNEL_TOKEN + target id
  line_target_id: ${NO7_LINE_TARGET_ID:}
  webhook_enabled: ${NO7_WEBHOOK_ENABLED:false}    # needs NO7_WEBHOOK_URL
  webhook_url: ${NO7_WEBHOOK_URL:}
  # API base override: point the transport at a local server that speaks the same
  # protocol (how delivery is tested here). Plain HTTP is accepted only for a
  # private host; anything else falls back to the public endpoint and says so.
  telegram_api_base: ${NO7_TELEGRAM_API_BASE:}
  line_api_base: ${NO7_LINE_API_BASE:}

# More than one process. The runtime lease already guarantees only one process
# trades; a shared backend lets the others serve its live frames instead of idling
# (that is what makes `uvicorn --workers N` usable). `local` = single process.
cluster:
  backend: ${NO7_CLUSTER_BACKEND:local}      # local | redis
  redis_url: ${NO7_REDIS_URL:}               # e.g. redis://127.0.0.1:6379/0
  key_prefix: no7
  state_ttl_seconds: 10                      # a frame older than this is gone, by design
  # A process that could not take the lease keeps checking whether the leader
  # went quiet (heartbeat older than 30s) and takes over. Only one can win: the
  # claim is a compare-and-set. Set false to require a manual restart instead.
  hot_standby: ${NO7_HOT_STANDBY:true}
  standby_poll_seconds: 5

# WebSocket: a light frame every second, a full payload (with analysis/forecast)
# at least this often so those panels never freeze.
ws:
  full_snapshot_seconds: 5

# Per-identity limits (token buckets). Separate from the login throttle: this is
# about capacity, not credentials. `default` covers GETs and everything unlisted.
ratelimit:
  enabled: true
  # Who shares a budget:
  # memory = this process only. One worker; with --workers N each gets its own budget.
  # sqlite = a small SQLite file, so every worker on this host shares one budget.
  #          Costs a write per limited request; file defaults to
  #          storage/db/ratelimit.sqlite3 (override with store_path).
  # redis  = every worker and every host shares one budget (needs `pip install redis`
  #          and redis_url / NO7_REDIS_URL). Falls back to sqlite (or memory, and says
  #          why) if Redis is unreachable — reported in /api/system/health → ratelimit.
  store: ${NO7_RATELIMIT_STORE:memory}
  redis_url: ${NO7_REDIS_URL:}
  key_prefix: ${NO7_RATELIMIT_PREFIX:no7:ratelimit}
  rules:
    order: {limit: 10, window_seconds: 60}
    explain: {limit: 20, window_seconds: 60}
    backtest: {limit: 6, window_seconds: 60}
    train: {limit: 2, window_seconds: 3600}
    default: {limit: 300, window_seconds: 60}
